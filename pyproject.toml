[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-kernels-from-scratch"
version = "0.1.0"
description = "FlashAttention-2 (forward + backward), fused softmax and RMSNorm written in Triton, verified against PyTorch and benchmarked on real GPUs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kishor Hange" }]
dependencies = ["torch>=2.3", "triton>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"src/tkern/bench.py" = ["B023"]  # benchmark lambdas are called inside the same iteration
